name: Secret & Privacy Security Audit

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  github-activity-actions-only:
    name: GitHub activity stays in Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check deployment files and snapshot reader
        run: |
          python3 -m unittest discover -s tests -p test_actions_only.py
          python3 -m unittest discover -s tests -p test_github_activity.py

  secret-scan:
    name: API Key & Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Secret Scanner
        run: |
          python3 scripts/check_secrets.py --all
